<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h2>Калькулятор</h2>
        <input type="text" id="display" readonly placeholder="0">
        
        <div class="buttons">
            <button onclick="clearDisplay()" class="btn-ctrl">C</button>
            <button onclick="deleteLast()" class="btn-ctrl">DEL</button>
            <button onclick="appendValue('/')" class="btn-op">/</button>
            <button onclick="appendValue('*')" class="btn-op">*</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="btn-op">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="btn-op">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculateResult()" class="btn-equal">=</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calcTrig('sin')" class="btn-trig">sin</button>
            <button onclick="calcTrig('cos')" class="btn-trig">cos</button>
            <button onclick="calcTrig('tan')" class="btn-trig">tan</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
